[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PIP_EXTRA_INDEX_URL = "https://pypi.ngc.nvidia.com https://download.pytorch.org/whl/cu121"

[tool.hatch.metadata]
# for git-referenced dependencies
allow-direct-references = true

[project]
name = "sam3d_objects"
version = "0.0.1"
# required for "hatch-requirements-txt" to work
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.build]
ignore-vcs = true
include = ["**/*.py", "forecast_basis.py"]
exclude = ["conftest.py", "*_test.py"]
# The FlowMatching model imports these sibling implementation packages at module load.
# Include them so a wheel-installed solver/model smoke does not depend on the source checkout.
packages = ["sam3d_objects", "faster_utils_slat", "taylor_utils_slat", "token_slat"]

[tool.hatch.build.targets.wheel]
force-include = {"forecast_basis.py" = "forecast_basis.py"}

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
p3d = ["requirements.p3d.txt"]
inference = ["requirements.inference.txt"]
dev = ["requirements.dev.txt"]
